<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>3D Produktansicht</title>

  <!-- Favicon -->
  <link
    rel="icon"
    href="https://view.publitas.com/84732/branding/favicon-5bf15be851d459cbe1b0c3fd5194679a62422147.ico"
  >

  <!-- Google model-viewer -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
    }


    /* =========================================
       3D MODEL VIEWER
       ========================================= */

    model-viewer {
      width: 100%;
      height: 100vh;
      background: #f5f5f5;
    }


    /* =========================================
       LADEANZEIGE FÜR DAS 3D-MODELL
       ========================================= */

    #loading-overlay {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #f5f5f5;

      z-index: 5;

      transition:
        opacity 0.4s ease,
        visibility 0.4s ease;

      pointer-events: none;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .loading-bar {
      width: min(320px, 75vw);
      height: 10px;

      background: #d8d8d8;

      border-radius: 20px;
      overflow: hidden;
    }

    #loading-progress {
      width: 0%;
      height: 100%;

      background: #222;

      border-radius: 20px;

      transition: width 0.15s ease;
    }

    #loading-percent {
      margin-top: 10px;

      font-size: 14px;
      color: #555;
    }


    /* =========================================
       AR BUTTON
       ========================================= */

    #ar-button {
      position: absolute;

      left: 50%;

      bottom:
        max(
          30px,
          env(safe-area-inset-bottom)
        );

      transform: translateX(-50%);

      min-width: 230px;

      padding: 16px 22px;

      border: none;
      border-radius: 999px;

      background: #111;
      color: #fff;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0 6px 18px
        rgba(0, 0, 0, 0.25);

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    #ar-button:active {
      transform:
        translateX(-50%)
        scale(0.96);
    }


    /* Button-Text beim Start */

    #ar-button.starting {
      opacity: 0.8;
    }

    #ar-button.starting .button-text {
      display: none;
    }

    #ar-button .button-loading {
      display: none;

      align-items: center;
      justify-content: center;

      gap: 10px;
    }

    #ar-button.starting .button-loading {
      display: flex;
    }


    /* =========================================
       KLEINER SPINNER IM BUTTON
       ========================================= */

    .button-spinner {
      width: 18px;
      height: 18px;

      border:
        2px solid
        rgba(255, 255, 255, 0.35);

      border-top-color: #fff;

      border-radius: 50%;

      animation:
        buttonSpin
        0.8s
        linear
        infinite;
    }

    @keyframes buttonSpin {
      to {
        transform: rotate(360deg);
      }
    }


    /* =========================================
       AR VOLLBILD-LADEANZEIGE
       ========================================= */

    #ar-loading-overlay {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background:
        rgba(255, 255, 255, 0.97);

      z-index: 9999;
    }

    #ar-loading-overlay.visible {
      display: flex;
    }

    .ar-loading-box {
      text-align: center;
      padding: 30px;
    }

    .ar-spinner {
      width: 46px;
      height: 46px;

      margin:
        0 auto
        20px auto;

      border:
        4px solid #ddd;

      border-top-color:
        #111;

      border-radius: 50%;

      animation:
        arSpin
        0.8s
        linear
        infinite;
    }

    @keyframes arSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .ar-loading-title {
      font-size: 21px;
      font-weight: 600;

      margin-bottom: 10px;
    }

    .ar-loading-text {
      max-width: 320px;

      font-size: 14px;
      line-height: 1.5;

      color: #666;
    }


    /* Standard-Ladebalken von model-viewer ausblenden */

    model-viewer::part(default-progress-bar) {
      display: none;
    }

  </style>

</head>


<body>


  <!-- =========================================
       3D MODEL
       ========================================= -->

  <model-viewer

    id="model"

    src="./npi-card-1.glb"

    ios-src="./npi-card-1.usdz"

    alt="3D-Modell des Produkts"

    ar

    ar-placement="wall"

    ar-scale="fixed"

    ar-modes="webxr scene-viewer quick-look"

    camera-controls

    camera-orbit="45deg 70deg 2.5m"
    min-camera-orbit="-80deg 10deg auto"
    max-camera-orbit="80deg 110deg auto"

    interaction-prompt="auto"

    shadow-intensity="1"

    exposure="1"

    environment-image="neutral"

    reveal="auto"

    loading="lazy">


    <!-- =========================================
         LADEBALKEN 3D-MODELL
         ========================================= -->

    <div id="loading-overlay">

      <div class="loading-title">
        3D-Modell wird geladen
      </div>

      <div class="loading-bar">

        <div id="loading-progress"></div>

      </div>

      <div id="loading-percent">
        0 %
      </div>

    </div>



    <!-- =========================================
         AR BUTTON
         ========================================= -->

    <button

      id="ar-button"

      slot="ar-button"

      type="button">


      <span class="button-text">

        Produkt in AR ansehen

      </span>


      <span class="button-loading">

        <span class="button-spinner"></span>

        AR wird geöffnet …

      </span>


    </button>


  </model-viewer>



  <!-- =========================================
       VOLLBILD-ANZEIGE BEIM AR-START
       ========================================= -->

  <div id="ar-loading-overlay">

    <div class="ar-loading-box">

      <div class="ar-spinner"></div>

      <div class="ar-loading-title">

        AR wird gestartet …

      </div>

      <div class="ar-loading-text">

        Das 3D-Modell wird für die
        AR-Ansicht vorbereitet.

        <br><br>

        Dies kann je nach Verbindung
        einige Sekunden dauern.

      </div>

    </div>

  </div>



  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>

    const modelViewer =
      document.querySelector('#model');

    const loadingOverlay =
      document.querySelector(
        '#loading-overlay'
      );

    const loadingProgress =
      document.querySelector(
        '#loading-progress'
      );

    const loadingPercent =
      document.querySelector(
        '#loading-percent'
      );

    const arButton =
      document.querySelector(
        '#ar-button'
      );

    const arLoadingOverlay =
      document.querySelector(
        '#ar-loading-overlay'
      );


    let arFallbackTimer = null;



    /* =========================================
       LADEFORTSCHRITT DES GLB-MODELLS
       ========================================= */

    modelViewer.addEventListener(

      'progress',

      (event) => {

        const progress =
          event.detail.totalProgress;

        const percent =
          Math.round(
            progress * 100
          );

        loadingProgress.style.width =
          percent + '%';

        loadingPercent.textContent =
          percent + ' %';

      }

    );



    /* =========================================
       MODELL IST VOLLSTÄNDIG GELADEN
       ========================================= */

    modelViewer.addEventListener(

      'load',

      () => {

        loadingProgress.style.width =
          '100%';

        loadingPercent.textContent =
          '100 %';


        setTimeout(

          () => {

            loadingOverlay.classList.add(
              'hidden'
            );

          },

          300

        );

      }

    );



    /* =========================================
       AR BUTTON WIRD ANGEKLICKT
       ========================================= */

    arButton.addEventListener(

      'click',

      () => {


        /* Button sofort sichtbar verändern */

        arButton.classList.add(
          'starting'
        );


        /* Vollbild-Ladeanzeige öffnen */

        arLoadingOverlay.classList.add(
          'visible'
        );


        /* Alten Timer entfernen */

        if (arFallbackTimer) {

          clearTimeout(
            arFallbackTimer
          );

        }


        /*
          Falls Quick Look aus irgendeinem
          Grund NICHT öffnet, wird die
          Ladeanzeige nach 15 Sekunden
          wieder entfernt.
        */

        arFallbackTimer =
          setTimeout(

            () => {

              if (!document.hidden) {

                resetArLoading();

              }

            },

            15000

          );

      }

    );



    /* =========================================
       NUTZER KOMMT AUS QUICK LOOK ZURÜCK
       ========================================= */

    document.addEventListener(

      'visibilitychange',

      () => {

        if (!document.hidden) {

          resetArLoading();

        }

      }

    );



    /* =========================================
       AUCH BEI RÜCKKEHR AUF IOS ZURÜCKSETZEN
       ========================================= */

    window.addEventListener(

      'pageshow',

      () => {

        resetArLoading();

      }

    );



    /* =========================================
       AR-LADEANZEIGE ZURÜCKSETZEN
       ========================================= */

    function resetArLoading() {

      arButton.classList.remove(
        'starting'
      );

      arLoadingOverlay.classList.remove(
        'visible'
      );


      if (arFallbackTimer) {

        clearTimeout(
          arFallbackTimer
        );

        arFallbackTimer = null;

      }

    }


  </script>


</body>

</html>
